AWSTemplateFormatVersion: '2010-09-09'
Description: 'AeroLink Cloud Infrastructure - Phase 5: Frontend CDN & Observability'

Parameters:
  EnvironmentName:
    Type: String
    Default: aerolink-prod
    Description: Name of the environment

Resources:
  # ---------------------------------------------------------
  # Amazon S3 (Static Website Hosting for React)
  # ---------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CloudFront Origin Access Control (OAC) for secure S3 access
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${EnvironmentName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ---------------------------------------------------------
  # Amazon CloudFront (Global Content Delivery Network)
  # ---------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - DomainName: !ImportValue 
              'Fn::Sub': '${EnvironmentName}-ALBDNSName'
            Id: ALBOrigin
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: allow-all
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Accept
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          # Required for React Router to handle client-side routing properly
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---------------------------------------------------------
  # AWS X-Ray (Distributed Tracing)
  # ---------------------------------------------------------
  XRayGroup:
    Type: AWS::XRay::Group
    Properties:
      GroupName: !Sub ${EnvironmentName}-tracing-group
      FilterExpression: "service(\"aerolink\")"

  # ---------------------------------------------------------
  # Amazon CloudWatch (Centralized Observability Dashboard)
  # ---------------------------------------------------------
  AeroLinkDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${EnvironmentName}-dashboard
      DashboardBody: !Sub >
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${EnvironmentName}-api" ],
                  [ ".", "4XXError", ".", "." ],
                  [ ".", "5XXError", ".", "." ]
                ],
                "region": "${AWS::Region}",
                "title": "API Gateway Traffic & Errors"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "*" ]
                ],
                "region": "${AWS::Region}",
                "title": "Load Balancer Total Requests"
              }
            }
          ]
        }

Outputs:
  CloudFrontURL:
    Description: URL of the CloudFront Distribution (Your Global Website URL)
    Value: !Join ['', ['https://', !GetAtt CloudFrontDistribution.DomainName]]
  S3BucketName:
    Description: S3 Bucket Name for Frontend Uploads
    Value: !Ref FrontendBucket
