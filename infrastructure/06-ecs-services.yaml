AWSTemplateFormatVersion: '2010-09-09'
Description: 'AeroLink Cloud Infrastructure - Phase 6: ECS Services & Routing'

Parameters:
  EnvironmentName:
    Type: String
    Default: aerolink-prod
    Description: Name of the environment

Resources:
  # ---------------------------------------------------------
  # IAM Role for ECS Task Execution (Allows pulling from ECR)
  # ---------------------------------------------------------
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------------------------------------------------------
  # IAM Role for ECS Task (Allows accessing DynamoDB)
  # ---------------------------------------------------------
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: 
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AeroLink-Checkins
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AeroLink-Baggage
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AeroLink-FlightOps
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AeroLink-Payments

  # ---------------------------------------------------------
  # Booking Service Target Group & ALB Listener
  # ---------------------------------------------------------
  BookingTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-booking-tg
      VpcId: !ImportValue 
        'Fn::Sub': '${EnvironmentName}-VpcId'
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  # ALB Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !ImportValue 
        'Fn::Sub': '${EnvironmentName}-ALBARN'
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: 'Not Found'

  BookingListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/bookings*
            - /api/flights*
            - /api/health*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BookingTargetGroup

  # ---------------------------------------------------------
  # Booking Service ECS Task Definition
  # ---------------------------------------------------------
  BookingTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-booking-task
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: booking-container
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aerolink/booking-service:latest
          PortMappings:
            - ContainerPort: 3001
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${EnvironmentName}-booking
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  BookingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-booking
      RetentionInDays: 7

  # ---------------------------------------------------------
  # Booking Service ECS Service
  # ---------------------------------------------------------
  BookingService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !ImportValue 
        'Fn::Sub': '${EnvironmentName}-ECSClusterName'
      ServiceName: booking-service
      TaskDefinition: !Ref BookingTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-private-az1-id'
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-private-az2-id'
          SecurityGroups:
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-ECSTaskSecurityGroup'
      LoadBalancers:
        - ContainerName: booking-container
          ContainerPort: 3001
          TargetGroupArn: !Ref BookingTargetGroup

  # =========================================================
  # Check-in Service Resources
  # =========================================================
  
  CheckinTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-checkin-tg
