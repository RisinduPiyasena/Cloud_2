      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  CheckinListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values:
            - /api/checkin*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CheckinTargetGroup

  CheckinTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-checkin-task
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: checkin-container
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aerolink/checkin-service:latest
          Environment:
            - Name: USE_DYNAMODB
              Value: "true"
            - Name: DYNAMODB_CHECKIN_TABLE
              Value: "AeroLink-Checkins"
            - Name: BOOKING_HOST
              Value: !ImportValue 
                'Fn::Sub': '${EnvironmentName}-ALBDNSName'
            - Name: BOOKING_PORT
              Value: "80"
            - Name: BAGGAGE_HOST
              Value: !ImportValue 
                'Fn::Sub': '${EnvironmentName}-ALBDNSName'
            - Name: BAGGAGE_PORT
              Value: "80"
          PortMappings:
            - ContainerPort: 3003
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${EnvironmentName}-checkin
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  CheckinLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-checkin
      RetentionInDays: 7

  CheckinService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !ImportValue 
        'Fn::Sub': '${EnvironmentName}-ECSClusterName'
      ServiceName: checkin-service
      TaskDefinition: !Ref CheckinTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-private-az1-id'
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-private-az2-id'
          SecurityGroups:
            - !ImportValue 
              'Fn::Sub': '${EnvironmentName}-ECSTaskSecurityGroup'
      LoadBalancers:
        - ContainerName: checkin-container
          ContainerPort: 3003
          TargetGroupArn: !Ref CheckinTargetGroup

